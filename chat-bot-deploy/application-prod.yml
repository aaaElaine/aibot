server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: support-bot

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatbot}
    username: ${DB_USERNAME:chatbot}
    password: ${DB_PASSWORD:chatbot123}
    driver-class-name: org.postgresql.Driver

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com
      chat:
        options:
          model: ${DASHSCOPE_MODEL:qwen-max}
          temperature: 0.7
          topP: 0.9
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:qwen3.7-text-embedding}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE
        dimensions: 1024

rag:
  enabled: ${RAG_ENABLED:true}

# 免费模型白名单
free-models:
  chat:
    - qwen3.7-max
    - qwen3.7-max-2026-05-17
    - qwen3.7-max-2026-06-08
    - qwen3.7-max-preview
    - qwen3.7-plus
    - qwen3.7-flash
    - qwen3.7-flash-2026-07-15
    - deepseek-v4-flash-0731
    - glm-5.2
    - qwen3.5-ocr
    - qwen-max
    - qwen-plus
    - qwen-turbo
  embedding:
    - qwen3.7-text-embedding

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: true
      logic-not-delete-value: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.wok: INFO
    org.springframework.ai: WARN
