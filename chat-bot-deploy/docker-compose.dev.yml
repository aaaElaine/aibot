version: '3.8'

services:
  chatbot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-chatbot}
      DB_USERNAME: ${POSTGRES_USER:-chatbot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-chatbot123}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-your-dashscope-api-key}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen3.7-max}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-qwen3.7-text-embedding}
      SERVER_PORT: 8080
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"